name: Automatisation des tests DevSecOps
on: push
jobs:
  Dependances:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependances
        run: |
          docker run --rm -v "$PWD":/project aquasec/trivy:latest fs \
            --scanners vuln --severity HIGH,CRITICAL --exit-code 1 \
            /project/requirements.txt
  Dockerfile:
    runs-on: ubuntu-latest
    needs: Dependances
    steps:
      - uses: actions/checkout@v4
      - name: Test Dockerfile
        run: |
          docker run --rm -v "$PWD":/project aquasec/trivy:latest config \
            --exit-code 1 /project
          docker build -t imgsecure:ci .
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image \
            --severity HIGH,CRITICAL --exit-code 1 imgsecure:ci
  Deploy:
    runs-on: ubuntu-latest
    needs: Dockerfile
    steps:
      - name: Deploy
        run: |
          echo "Rien à faire ici. Votre application est prête à être déployée"
